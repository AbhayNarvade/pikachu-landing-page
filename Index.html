<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu UI</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./favicon-32x32.png" type="image/x-icon">
  </head>

  <body>
    <div class="container">
      <!-- NAVBAR -->

      <nav>
        <img src="./pokemon.png" alt="pokemon logo" />

        <i class="ri-menu-3-line"></i>
      </nav>

      <!-- MAIN -->

      <main>
        <!-- LEFT -->

        <section class="left">
          <h4>POKEMON GEN I</h4>

          <h1>Pikachu</h1>

          <p>
            Pikachu is an Electric-type Pokémon introduced in Generation I.
            Pikachu are small, chubby, and incredibly cute mouse-like Pokémon.
            They are almost completely covered by yellow fur.
          </p>

          <div class="counter">
            <div class="line"></div>

            <h2>01/08</h2>
          </div>
        </section>

        <!-- CENTER -->

        <section class="center">
          <img src="./pikachu.png" alt="Pikachu" />
        </section>

        <!-- RIGHT -->

        <section class="right">
          <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </section>
      </main>

      <!-- POKEBALL -->

      <img class="pokeball" src="./pockeball.png" alt="pokeball" />
    </div>
  </body>
</html>
